


[workspace.package]
version = "0.0.0"
edition = "2021"
homepage = "https://github/dbnexus"
repository = "https://github.com/dbnexus/dbnexus"
license = "Unlicense"

[workspace]
members = ["dbnexus-db", "dbnexus-app/src-tauri", "dbnexus-db2"]
resolver = "2"

[workspace.dependencies]
# workspace dependencies
dbnexus-core = { path = "dbnexus-core" }
dbnexus-db = { path = "dbnexus-db" }
dbnexus-db2 = { path = "dbnexus-db2" }

# crates.io dependencies
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
async-trait = "0.1"
dashmap = "6.1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = "1.0"
hex = "0.4.3"
chrono = "*"
lazy_static = "1.5.0"
log = { version = "0.4.22", features = ["std"] }
futures-util = "*"
futures-core = "*"
mongodb = { version = "3.3", features = ["openssl-tls"] }
rand = "0.10"
tokio-util = "*"
uuid = { version = "*", features = ["v4"] }
include_dir = "0.7.4"
base64 = "*"
redis = { version = "1", features = [
    "tokio-comp",
    "aio",
    "connection-manager",
    "tokio-native-tls-comp",

] }
# this sqlparser must match the version of sql insight
sqlparser = { version = "0.62", features = ["serde", "visitor"] }
sql-insight = "0.5.0"
specta-typescript = "0.0.11"
csv_processor = "0.1.10"
csv = "*"
rust_xlsxwriter = { version = "0.99", features = ["constant_memory", "chrono"] }
specta = { version = "=2.0.0-rc.24", features = ["derive", "serde_json"] }
calamine = { version = "*", features = ["chrono"] }
reqwest = { version = "0.13", features = ["json", "native-tls", "stream"] }
tempfile = "3.27.0"
tokio-native-tls = { version = "0.3.1", features = ["vendored"] }
r2d2 = "*"
