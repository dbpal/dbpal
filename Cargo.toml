
[workspace.package]
version = "0.0.0"
edition = "2021"
homepage = "https://github/dbnexus"
repository = "https://github.com/dbnexus/dbnexus"
license = "Unlicense"

[workspace]
members = ["dbnexus-db", "dbnexus-app/src-tauri"]
resolver = "2"

[workspace.dependencies]
# workspace dependencies
dbnexus-core = { path = "dbnexus-core" }
dbnexus-db = { path = "dbnexus-db" }

# crates.io dependencies
serde_json = "1.0"
async-trait = "0.1"
dashmap = "6.1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = "1.0"
hex = "0.4.3"
chrono = "*"
lazy_static = "1.5.0"
log = { version = "0.4.22", features = ["std"] }
futures-util = "*"
futures-core = "*"
mongodb = { version = "3.3", features = ["rustls-tls"] }
rand = "0.9"
tokio-util = "*"
uuid = { version = "*", features = ["v4"] }
typescript-type-def = "0.5.11"
include_dir = "0.7.4"
