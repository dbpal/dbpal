[workspace.package]
version = "0.0.0"
edition = "2021"
homepage = "https://github/dbnexus"
repository = "https://github.com/dbnexus/dbnexus"
license = "Unlicense"

[workspace]
members = ["dbnexus-db", "dbnexus-app/src-tauri", "grpc-server"]
resolver = "2"

[workspace.dependencies]
# workspace dependencies
dbnexus-core = { path = "dbnexus-core" }
dbnexus-db = { path = "dbnexus-db" }

# crates.io dependencies
serde_json = "1.0"
tauri = { version = "1.6", features = ["shell-open"] }
async-trait = "0.1"
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "028084bce3a741e995c3e6c559c6dbb27a62534d", features = [
    "runtime-tokio",
    "postgres",
    "sqlite",
    "mysql",
    "bigdecimal",
    "mac_address",
    "chrono",
    "ipnetwork",
    "bit-vec",
    "uuid",
    "json",
    "tls-rustls",
] }

redis = { version = "*", features = [
    "tokio-comp",
    "aio",
    "connection-manager",
] }

dashmap = "6.1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = "1.0"
hex = "0.4.3"
mac_address = "1.1.5"
ipnetwork = "0.20.0"
chrono = "0.4.34"
bit-vec = "0.6.3"

sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", rev = "5a510ac4d9715528ad5c518bf1ce0719cc813b8c", features = [
    "serde",
] }
lazy_static = "1.5.0"
line-index = "0.1.1"
log = "0.4.22"


futures-util = "*"
futures-core = "*"
mongodb = { version = "3.0.1", features = [] }
tiberius = { version = "0.12.3", default-features = false, features = [
    "chrono",
    "rust_decimal",
    "tds73",
    "rustls",
] }
tokio-util = "*"
rust_decimal = "*"
bb8-tiberius = "*"
bb8 = "*"
fuzzy-matcher = "*"
pg_interval = "*"
uuid = { version = "*", features = ["v4"] }
typescript-type-def = "0.5.11"
sqlformat = "0.3.0"
bson = { version = "*" }

env_logger = "0.11.5"
