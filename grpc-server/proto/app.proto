syntax = "proto3";

package app;
import "google/protobuf/empty.proto";
service MyService {
  rpc SayHello(HelloRequest) returns (HelloResponse);
  rpc ReturnErr(HelloRequest) returns (HelloResponse);
}

message HelloRequest { string name = 1; }

message HelloResponse { string message = 1; }

message MysqlDBConfig {
  string host = 1;
  uint32 port = 2; // Protobuf 中没有 u16，因此使用 uint32
  string username = 3;
  string password = 4;
  optional string db_name = 5; // 可选字段将由 Protobuf 处理
  bool read_only = 6;
}
message RedisDBConfig {
  string host = 1;
  optional uint32 port = 2;     // 使用 uint32 表示无符号整数
  optional string username = 3; // 可选字段
  optional string password = 4; // 可选字段
  optional string db = 5;       // 可选字段
  bool read_only = 6;
}
message MongoConfig {
  string host = 1;
  uint32 port = 2;                     // 使用 uint32 表示无符号整数
  optional string username = 3;        // 可选字段
  optional string password = 4;        // 可选字段
  optional uint64 connect_timeout = 5; // 毫秒
  optional string db = 6;
  bool read_only = 7;
}

message PGDbConfig {
  string host = 1;
  uint32 port = 2; // 使用 uint32 表示无符号整数
  string username = 3;
  string password = 4;
  optional string db_name = 5; // 可选字段
  optional string schema = 6;  // 可选字段
  bool read_only = 7;
}

message SqlServerDbConfig {
  string host = 1;
  uint32 port = 2; // 使用 uint32 表示无符号整数
  string username = 3;
  string password = 4;
  optional string db_name = 5; // 可选字段
  bool trust_cert = 6;
  optional string schema = 7;
  bool read_only = 8;
}

message OracleDbConfig {
  string username = 1;
  string password = 2;
  string connect_str = 3;
  optional string schema = 4;
  optional uint64 call_timeout = 5; // 毫秒
  bool read_only = 6;
}

message DBConnectionConfig {
  message SqliteConfig {
    string path = 1;
    string name = 2;
    bool read_only = 3;
  }

  message MysqlConfig {
    MysqlDBConfig conn = 1; // 假设 MysqlDbConfig 已经定义
    string name = 2;
  }

  message MariaDBConfig {
    MysqlDBConfig conn = 1; // 假设 MysqlDbConfig 已经定义
    string name = 2;
  }

  message PostgresConfig {
    PGDbConfig conn = 1; // 假设 PGDbConfig 已经定义
    string name = 2;
  }

  message SqlServerConfig {
    SqlServerDbConfig conn = 1; // 假设 SqlServerDbConfig 已经定义
    string name = 2;
  }

  message MongoDBConfig {
    MongoConfig conn = 1; // 假设 MongoConfig 已经定义
    string name = 2;
  }

  message RedisConfig {
    RedisDBConfig conn = 1;
    string name = 2;
  }

  message OracleConfig {
    OracleDbConfig conn = 1; // 假设 OracleDbConfig 已经定义
    string name = 2;
  }

  oneof config {
    SqliteConfig sqlite = 1;
    MysqlConfig mysql = 2;
    MariaDBConfig mariadb = 3;
    PostgresConfig postgres = 4;
    SqlServerConfig sqlserver = 5;
    MongoDBConfig mongo = 6;
    RedisConfig redis = 7;
    OracleConfig oracle = 8;
  }
}

message UpdateConfig {
  string uuid = 1;
  DBConnectionConfig config = 2;
}
message AddConfigResp { string uuid = 1; }
message DelConfigReq { string uuid = 1; }

message ListAllConfigResp { map<string, DBConnectionConfig> items = 1; }
message TestConnResp { uint64 ping_value = 1; }
service ConfigService {
  rpc Add(DBConnectionConfig) returns (AddConfigResp);
  rpc Update(UpdateConfig) returns (google.protobuf.Empty);
  rpc Del(DelConfigReq) returns (google.protobuf.Empty);
  rpc ListAll(google.protobuf.Empty) returns (ListAllConfigResp);
  rpc open(OnlyUuidReq) returns (google.protobuf.Empty);
  rpc TestConn(OnlyUuidReq) returns (TestConnResp);
}

message OnlyUuidReq { string uuid = 1; }
/// general database service
/// maybe a catelog, database or schema
/// because of those trait share a lot of
/// common behavior

message ListTableResp { repeated ListTableRespItem tables = 1; }
message ListTableRespItem {
  string name = 1;
  string size = 2;
}
message RedisListTableResp {
  repeated string string_tables = 1;
  repeated string list_tables = 2;
  repeated string set_tables = 3;
  repeated string zset_tables = 4;
  repeated string hash_tables = 5;
}

message UuidAndName {
  string uuid = 1;
  // maybe table view name staff.
  // uuid and name can locate a lot of things.
  string name = 2;
}

message Field {
  string name = 1;
  string typ = 2;
  bool nullable = 3;
  optional string default_value = 4;
  bool is_primary = 5;
  bool is_auto_increment = 6;
}

message ShowColumnsResp { repeated Field columns = 1; }

message RedisMatchKeysResp { repeated string keys = 1; }
message TableViewListReq {
  string uuid = 1;
  string table_name = 2;
  optional string where_str = 3;
  optional string order_by = 4;
  uint64 page = 5;
  uint64 page_size = 6;
}

message TableListResp {
  repeated Field fields = 1; // List of fields
  uint64 total = 2;          // Total number of records
  repeated Row data = 3; // List of rows, each row is a list of optional strings
  optional string sql = 4; // SQL query string
}

message Row {
  repeated RowData values = 1; // List of optional string values
}

enum IndexKind {
  NORMAL = 0;  // Normal index
  UNIQUE = 1;  // Unique index
  PRIMARY = 2; // Primary index
}

message Index {
  string name = 1;        // Name of the index
  IndexKind kind = 2;     // Type of index
  repeated string on = 3; // List of columns the index is on
}

message RowData { optional string data = 1; }

message ShowIndexResp { repeated Index indexes = 1; }

message String2OptionString {
  map<string, String2OptionStringValue> values = 1;
}
message String2OptionStringValue { optional string value = 1; }

message InsertReq {
  string uuid = 1;
  string table_name = 2;
  String2OptionString values = 3;
}
message SqlExecuteRet {
  string sql = 1;     // The executed SQL statement
  uint64 changes = 2; // Number of changes made by the SQL statement
  optional int64 last_insert_row_id =
      3; // ID of the last inserted row (optional)
  optional string last_insert_id_string =
      4; // Last inserted ID as a string (optional, for databases like MongoDB)
}
message UpdateReq {
  string uuid = 1;
  string table_name = 2;
  String2OptionString values = 3;
  String2OptionString wheres = 4;
}
message DeleteReq {
  string uuid = 1;
  string table_name = 2;
  String2OptionString wheres = 4;
}

message NamedStaff {
  string name = 1; // Name of the staff member
}

message NamedStaffVec { repeated NamedStaff named = 1; }
message OpendKindResp { OpendKind kind = 1; }

enum OpendKind {
  CATELOG = 0;  // Catalog kind
  DATABASE = 1; // Database kind
  SCHEMA = 2;   // Schema kind
}

message StringResp { string value = 1; }
message QuerySqlReq {
  string uuid = 1;
  string sql = 2;
  string query_id = 3;
}

message QuerySqlResp { repeated QueryRespOrErr results = 1; }

message QueryResp {
  repeated Field fields = 1;
  repeated Row data = 2;
}

message QueryRespOrErr {
  oneof result {
    Err err = 1;
    QueryResp resp = 2;
  }
}

message Err { string err = 1; }

message UuidAndQueryID {
  string uuid = 1;
  string query_id = 2;
}
message UserSettings {
  uint32 page_size = 1; // Size of the page
}

message FormatSqlReq {
  string uuid = 1;
  string sql = 2;
}

enum TriggerTiming {
  BEFORE = 0;     // Before trigger timing
  AFTER = 1;      // After trigger timing
  INSTEAD_OF = 2; // Instead of trigger timing
}

enum TriggerEvent {
  INSERT = 0; // Insert event
  UPDATE = 1; // Update event
  DELETE = 2; // Delete event
}

message TriggerEnable {
  oneof enable {
    TriggerEnablePostgres postgres = 1;
    bool just_enable = 2;
  }
}

message TriggerEnablePostgres { optional string enable = 1; }
message CommonriggerReq {
  string uuid = 1;
  string table = 2;
  string name = 3;
}

message TriggerDetail {
  TriggerTiming timing = 1;     // Trigger timing (Before, After, InsteadOf)
  TriggerEvent event = 2;       // Trigger event (Insert, Update, Delete)
  string sql = 3;               // SQL statement for the trigger
  TriggerEnable enable = 4;     // Trigger enable options (optional)
  repeated MetaValue metas = 5; // List of metadata values
}
message MetaValue {
  string name = 1;
  optional string value = 2;
  optional string desc = 3;
}
message RenameTableReq {
  string uuid = 1;
  string old_table = 2;
  string new_table = 3;
}

message DuplicateTableReq {
  string uuid = 1;
  string table = 2;
  string dup = 3;
}

message UuidAndPattern {
  string uuid = 1;
  string pattern = 2;
}
message ExportTableReq {
  string uuid = 1;
  string table_name = 2;
  string filepath = 3;
  ExportKind kind = 4;
}
message ExportQueryResultReq {
  string uuid = 1;
  string sql = 2;
  string filepath = 3;
  ExportKind kind = 4;
}

message ExportKind {
  oneof kind {
    ExportKindCsv csv = 1;
    ExportKindJson json = 2;
    ExportKindJsonLine json_line = 3;
    ExportKindSql sql = 4;
  }
}

message ExportKindCsv {
  bool include_header = 1;
  string delimiter = 2; // using string for char representation
}

message ExportKindJson { bool pretty = 1; }

message ExportKindJsonLine {}

message ExportKindSql { bool include_table_schema = 1; }
message UdfDetail {
  string def = 1;               // Definition of the SQL.
  repeated MetaValue metas = 2; // List of MetaValue.
}

message DropUdfExtraParameter {
  oneof parameter_type { DropUdfExtraParameterPostGres postgres = 1; }
}

message DropUdfExtraParameterPostGres {
  string parameters = 1; // e.g., "a integer, b integer"
}
message DropUdfReq {
  string uuid = 1;
  string name = 2;
  optional DropUdfExtraParameter extra = 3;
}

message ProcedureDetail {
  string def = 1;               // Definition of the SQL.
  repeated MetaValue metas = 2; // List of MetaValue.
}
message AutoCompletionReq {
  string uuid = 1;
  string sql = 2;
  uint32 line = 3;
  uint32 col = 4;
}
enum CompletionKind {
  SchemaName = 0; // Default value for unknown completion kind
  COMMAND = 1;    // Command used by Redis
  KEYWORD = 2;    // Keyword
  FUNCTION = 3;   // Function
  DBNAME = 4;     // Database name
  TABLENAME = 5;  // Table name
  COLUMN = 6;     // Column
  TEXT = 7;       // Text
  TYPE = 8;       // Type
}

message AutoCompletionItem {
  string item = 1;
  CompletionKind ck = 2;
}

message AutoCompletionResp { repeated AutoCompletionItem items = 1; }
service DatabaseService {
  rpc ListTable(OnlyUuidReq) returns (ListTableResp);
  rpc RedisListTable(OnlyUuidReq) returns (RedisListTableResp);
  rpc RedisMatchKeys(UuidAndPattern) returns (RedisMatchKeysResp);
  rpc ShowColumns(UuidAndName) returns (ShowColumnsResp);
  rpc ShowTalbe(TableViewListReq) returns (TableListResp);
  rpc ShowIndex(UuidAndName) returns (ShowIndexResp);
  rpc Insert(InsertReq) returns (SqlExecuteRet);
  rpc Update(UpdateReq) returns (SqlExecuteRet);
  rpc TruncateTable(UuidAndName) returns (google.protobuf.Empty);
  rpc Delete(DeleteReq) returns (SqlExecuteRet);
  rpc ListView(OnlyUuidReq) returns (NamedStaffVec);
  rpc DropView(UuidAndName) returns (google.protobuf.Empty);
  rpc DropTable(UuidAndName) returns (google.protobuf.Empty);
  rpc ShowView(TableViewListReq) returns (TableListResp);
  rpc OpenSchema(UuidAndName) returns (google.protobuf.Empty);
  rpc OpenDB(UuidAndName) returns (google.protobuf.Empty);
  rpc OpenedKind(OnlyUuidReq) returns (OpendKindResp);
  rpc QuerySql(QuerySqlReq) returns (QuerySqlResp);
  rpc QuerySqlOpenConnection(OnlyUuidReq) returns (StringResp);
  rpc QuerySqlCloseConnection(UuidAndQueryID) returns (google.protobuf.Empty);
  rpc QuerySqlCloseReConnection(UuidAndQueryID) returns (google.protobuf.Empty);
  rpc SaveUserSettings(UserSettings) returns (google.protobuf.Empty);
  rpc GetUserSettings(google.protobuf.Empty) returns (UserSettings);
  rpc ExportTable(ExportTableReq) returns (google.protobuf.Empty);
  rpc FormatSql(FormatSqlReq) returns (StringResp);
  rpc ListTrigger(UuidAndName) returns (NamedStaffVec);
  rpc ShowTrigger(CommonriggerReq) returns (TriggerDetail);
  rpc EnableTrigger(CommonriggerReq) returns (google.protobuf.Empty);
  rpc DisableTrigger(CommonriggerReq) returns (google.protobuf.Empty);
  rpc RenameTable(RenameTableReq) returns (google.protobuf.Empty);
  rpc DuplicateTable(DuplicateTableReq) returns (google.protobuf.Empty);
  rpc ExportQueryResultToFile(ExportQueryResultReq)
      returns (google.protobuf.Empty);
  rpc ListUdf(OnlyUuidReq) returns (NamedStaffVec);
  rpc ShowUdf(UuidAndName) returns (UdfDetail);
  rpc DropUdf(DropUdfReq) returns (google.protobuf.Empty);

  rpc ListProcedure(OnlyUuidReq) returns (NamedStaffVec);
  rpc ShowProcedure(UuidAndName) returns (ProcedureDetail);
  rpc DropProcedure(UuidAndName) returns (google.protobuf.Empty);
  rpc DoAutoCompletion(AutoCompletionReq) returns (AutoCompletionResp);
}
