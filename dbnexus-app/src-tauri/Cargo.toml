[package]
name = "dbpal"
version = "0.0.0"
description = "A database management system"
authors = ["yuyangxxxmail@gmailc.om"]
edition = "2021"
default-run = "dbpal"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2.7", features = ["devtools"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dbnexus-db.workspace = true
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true
dashmap.workspace = true
futures-util.workspace = true
futures-core.workspace = true
lazy_static.workspace = true
log.workspace = true
uuid.workspace = true
typescript-type-def = "*"
bson.workspace = true
hex.workspace = true
mongodb.workspace = true
env_logger.workspace = true
rand = "*"
tauri-plugin-fs = "2.4"
humantime = "*"
tauri-plugin-store = "2.3"
tauri-plugin-http = "2.5"


tauri-plugin-clipboard-manager = "2"
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
tauri-plugin-opener = "2.4"
tauri-plugin-os = "2.3"
[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# 用来给前端来测试loading 按钮
# 打开口所有的接口都会卡一会
random-sleep = []
random-error = []
duckdb = ["dbnexus-db/duckdb"]
libsql = ["dbnexus-db/libsql"]


[lib]
name = "dbnexus_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]
