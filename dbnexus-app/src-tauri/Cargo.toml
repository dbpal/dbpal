[package]
name = "dbpal"
version = "0.0.0"
description = "A database management system"
authors = ["yuyangxxxmail@gmail.com"]
edition = "2021"
default-run = "dbpal"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
mimalloc = { version = "*", features = ["v3"] }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dbnexus-db.workspace = true
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true
dashmap.workspace = true
futures-util.workspace = true
futures-core.workspace = true
lazy_static.workspace = true
log.workspace = true
uuid.workspace = true
typescript-type-def = "*"
hex.workspace = true
mongodb.workspace = true
rand.workspace = true
chrono.workspace = true
tauri-plugin-fs = "2.4"
humantime = "*"
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-keyring = "0.1.0"
tauri-plugin-opener = "2.5"
tauri-plugin-os = "2.3"
font-kit = "0.14.3"
tauri-plugin-process = "2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
include_dir.workspace = true
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tauri-plugin-shell = "2"
sys-locale = "0.3.2"
tauri-plugin-http = "2"
tokio-util.workspace = true
tauri-plugin-devtools = "2.0.1"
tauri-plugin-log = "2"
[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# 用来给前端来测试loading 按钮
# 打开口所有的接口都会卡一会
random-sleep = []
random-error = []
duckdb = ["dbnexus-db/duckdb"]
paid = ["dbnexus-db/paid"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
