[package]
name = "dbnexus-db"
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
bb8.workspace = true
anyhow.workspace = true
serde.workspace = true
async-trait.workspace = true
sqlx.workspace = true
dashmap.workspace = true
hex.workspace = true
mac_address.workspace = true
ipnetwork.workspace = true
chrono.workspace = true
bit-vec = "0.6.3"
uuid.workspace = true
serde_json.workspace = true
sqlparser.workspace = true
lazy_static.workspace = true
line-index.workspace = true
log.workspace = true
redis.workspace = true
futures-util.workspace = true
futures-core.workspace = true
mongodb.workspace = true
tiberius.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rust_decimal.workspace = true
bb8-tiberius = "*"
oracle = { version = "0.6.3", features = ["chrono"] }
pg_interval = "*"
typescript-type-def = "*"
sqlformat = "*"
fuzzy-matcher = "*"
bson = "*"
humantime = "*"
humansize = "*"
memory-stats = "1.2.0"
rand = "*"
enum-iterator = "2.1.0"
cdrs-tokio = "8.1.5"
num-bigint = "*"
r2d2 = "*"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
clickhouse = { version = "0.13.1", features = ["rustls-tls", "time", "uuid"] }
# https://github.com/duckdb/duckdb-rs/issues/436  
duckdb = { version = "=1.1.1", features = ["bundled"], optional = true }
libduckdb-sys = { version = "=1.1.1", optional = true }
cql3-parser = { git = "https://github.com/dbpal/rust-cql3-parser", rev = "89aef5f99854449a78dc37a17363823f889374c8" }
libsql = { git = "https://github.com/tursodatabase/libsql", rev = "28294c9ea7577b4bcb5b5faac0c97dd102343851" }
rsfbclient = { version = "0.25.1", default-features = false, features = [
    "pure_rust",
] }
rsfbclient-rust = "*"
[dev-dependencies]


[features]
duckdb = ["dep:duckdb", "dep:libduckdb-sys"]
