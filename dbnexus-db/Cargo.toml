[package]
name = "dbnexus-db"
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true


[dependencies]

shlex = { version = "*" }
couchbase = { version = "1", features = [] }
snowflake-connector-rs = { version = "0.9", optional = true }
gcp-bigquery-client = { version = "0.28", optional = true }
sqlx = { version = "0.9.0-alpha.1", features = [
    "runtime-tokio",
    "postgres",
    "sqlite",
    "mysql",
    "bigdecimal",
    "mac_address",
    "chrono",
    "ipnetwork",
    "bit-vec",
    "uuid",
    "json",
    "tls-rustls",
] }
sqlx-core = { version = "0.9.0-alpha.1", features = ["any"] }

odbc-api = { version = "24", optional = true, features = [
    "vendored-unix-odbc",
] }

bb8 = "0.9"
anyhow.workspace = true
serde.workspace = true
async-trait.workspace = true
redis.workspace = true
tokio-stream = { version = "0.1.17", features = ["io-util"] }
rust_xlsxwriter = { version = "0.94", features = ["constant_memory"] }
dashmap.workspace = true
hex.workspace = true
mac_address = "1.1.5"
ipnetwork = "0.21"
chrono = "0.4.34"
sqlx-bit-vec = { package = "bit-vec", version = "*" }
uuid.workspace = true
serde_json.workspace = true
sqlparser = { version = "0.61", features = ["serde"] }
lazy_static.workspace = true
log.workspace = true
duckdb = { version = "=1.4.4", features = [
    "bundled",
    "r2d2",
    "extensions-full",
], optional = true }
cql3-parser = { git = "https://github.com/shotover/rust-cql3-parser", branch = "main" }
futures-util.workspace = true
futures-core.workspace = true
mongodb.workspace = true
tiberius = { version = "0.12.3", default-features = false, features = [
    "chrono",
    "rust_decimal",
    "tds73",
    "rustls",
] }
scylla = { version = "1.4.1", features = [] }
bb8-tiberius = "0.16"
tokio.workspace = true
tokio-util.workspace = true
rust_decimal = "*"
regex = "*"
v_htmlescape = "0.15.8"
oracle = { version = "0.6.3", features = ["chrono"] }
pg_interval = "*"
typescript-type-def = "*"
memory-stats = "1.2.0"
rand.workspace = true
num-bigint = "*"
r2d2 = "*"
base64 = "*"
reqwest.workspace = true
clickhouse = { version = "0.15", features = ["rustls-tls", "time", "uuid"] }
libsql = { version = "0.9.7", default-features = false, features = [
    "remote",
    "tls",
] }
rsfbclient = { version = "0.26", default-features = false, features = [
    "pure_rust",
] }
csv = "*"
rsfbclient-rust = "*"
include_dir.workspace = true
[dev-dependencies]


[features]
duckdb = ["dep:duckdb"]
paid = []
odbc = ["dep:odbc-api"]
bigquery = ["dep:gcp-bigquery-client"]
snowflake = ["dep:snowflake-connector-rs"]
hive = ["odbc"]
