[package]
name = "dbnexus-db"
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true


[dependencies]
sqlx = { version = "0.9.0-alpha.1", features = [
    "runtime-tokio",
    "postgres",
    "sqlite",
    "mysql",
    "bigdecimal",
    "mac_address",
    "chrono",
    "ipnetwork",
    "bit-vec",
    "uuid",
    "json",
    "tls-rustls",

] }
sqlx-core = { version = "0.9.0-alpha.1", features = ["any"] }
bb8 = "0.9"
anyhow.workspace = true
serde.workspace = true
async-trait.workspace = true
redis = { version = "*", features = [
    "tokio-comp",
    "aio",
    "tls-rustls",
    "connection-manager",
    "safe_iterators",
    "tokio-rustls-comp",

] }
tokio-stream = { version = "0.1.17", features = ["io-util"] }
rust_xlsxwriter = { version = "0.90.0", features = ["constant_memory"] }
dashmap.workspace = true
hex.workspace = true
mac_address = "1.1.5"
ipnetwork = "0.21"
chrono = "0.4.34"
bit-vec = "=0.6.3"
uuid.workspace = true
serde_json.workspace = true
sqlparser = { version = "0.60", features = ["serde"] }
lazy_static.workspace = true
log.workspace = true
duckdb = { version = "1.4.1", features = [
    "bundled",
    "r2d2",
    "extensions-full",
], optional = true }
cql3-parser = { git = "https://github.com/shotover/rust-cql3-parser", branch = "main" }
futures-util.workspace = true
futures-core.workspace = true
mongodb.workspace = true
tiberius = { version = "0.12.3", default-features = false, features = [
    "chrono",
    "rust_decimal",
    "tds73",
    "rustls",
] }
scylla = { version = "1.4.1", features = [] }
bb8-tiberius = "0.16"
tokio.workspace = true
tokio-util.workspace = true
rust_decimal = "*"
regex = "*"
v_htmlescape = "0.15.8"
oracle = { version = "0.6.3", features = ["chrono"] }
pg_interval = "*"
typescript-type-def = "*"
humantime = "*"
memory-stats = "1.2.0"
rand.workspace = true
num-bigint = "*"
r2d2 = "*"
base64 = "*"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
clickhouse = { version = "0.14", features = ["rustls-tls", "time", "uuid"] }
libsql = { version = "0.9.7", default-features = false, features = [
    "remote",
    "tls",
] }
rsfbclient = { version = "0.26", default-features = false, features = [
    "pure_rust",
] }
rsfbclient-rust = "*"
include_dir.workspace = true
[dev-dependencies]
opener = "*"

[features]
duckdb = ["dep:duckdb"]
